{% extends "base.html" %}

{% block title %}Login - CarnaticAI{% endblock %}

{% block content %}
<section class="auth-section d-flex align-items-center" style="min-height: 100vh; background: linear-gradient(to right, rgba(26,15,10,0.9) 0%, rgba(26,15,10,0.7) 100%), url('{{ url_for('static', filename='images/hero_bg_immersive.jpg') }}') no-repeat center center / cover;">
    <div class="container pt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="text-center mb-4">
                    <span class="text-gold" style="font-size: 3rem; line-height: 1;">&#9835;</span> 
                    <h2 class="text-cream mt-2 serif-font">Welcome Back</h2>
                    <p class="text-muted-custom">Continue your practice journey</p>
                </div>
                
                <div class="glass-card p-4 p-md-5 hover-lift">
                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-4">
                            <label for="email" class="form-label text-cream">Email Address</label>
                            <input type="email" class="form-control glass-input" id="email" name="email" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label text-cream">Password</label>
                            <input type="password" class="form-control glass-input" id="password" name="password" required>
                        </div>
                        <div class="d-grid mb-4">
                            <button type="submit" class="btn btn-primary-hero py-2 fs-5">Login</button>
                        </div>
                        <div class="text-center">
                            <span class="text-muted-custom">Don't have an account? </span>
                            <a href="{{ url_for('auth.register') }}" class="text-gold text-decoration-none nav-hover-gold">Register</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
